      \ = (\n        Field(..., description=\"What motivates the protagonist to ride\
      \ the dragon to the moon\")\n    )\n    story_setting: str = Field(..., description=\"\
      The setting of the story\")\n\n\ndef define_story_preconditions(general_input:\
      \ str, **kwargs) -> DefineStoryPreconditionsOutput:\n    \"\"\"\n    Defines\
      \ the preconditions for the story by specifying the protagonist's\n    details,\
      \ their meeting with the dragon, the motivation for their adventure,\n    and\
      \ the setting in which the story unfolds.\n\n    Parameters\n    ----------\n\
      \    protagonist_info : dict\n        A dictionary containing the protagonist's\
      \ name, age, and background.\n    dragon_encounter : str\n        A string describing\
      \ how the protagonist meets the dragon.\n    protagonist_motivation : str\n\
      \        A string outlining what motivates the protagonist to ride the dragon\n\
      \        to the moon.\n    story_setting : str\n        A string describing\
      \ the setting of the story.\n\n    Returns\n    -------\n    dict\n        A\
      \ dictionary containing the protagonist's name, age, background, the\n     \
      \   circumstances of their meeting with the dragon, their motivation for\n \
      \       the journey, and the story's setting.\n\n    Raises\n    ------\n  \
      \  TypeError\n        If the input types do not match the expected types.\n\n\
      \    Examples\n    --------\n    >>> define_story_preconditions({\n    ... \
      \    'protagonist_name': 'Eva',\n    ...     'protagonist_age': 25,\n    ...\
      \     'protagonist_background': 'Scientist'},\n    >>> 'The protagonist meets\
      \ the dragon in a dream.',\n    >>> 'To explore the moon and discover new species.',\n\
      \    >>> 'In a futuristic, space-exploring world.')\n    {'protagonist_name':\
      \ 'Eva', 'protagonist_age': 25, 'protagonist_background':\n    'Scientist',\
      \ 'dragon_meeting_circumstances': 'The protagonist meets the\n    dragon in\
      \ a dream.', 'protagonist_motivation': 'To explore the moon and\n    discover\
      \ new species.', 'story_setting': 'In a futuristic, space-exploring\n    world.'}\n\
      \n    \"\"\"\n    return DefineStoryPreconditionsOutput(\n        protagonist_name=\"\
      \",\n        protagonist_age=0,\n        protagonist_background=\"\",\n    \
      \    dragon_meeting_circumstances=\"\",\n        protagonist_motivation=\"\"\
      ,\n        story_setting=\"\",\n    )"
