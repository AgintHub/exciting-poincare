dag_type: plain_text
description: A workflow detailing the step-by-step process to create a fizzy bath
  bomb, mixing dry ingredients, adding wet components, molding, and curing.
name: construct_bath_bomb
nodes:
  combine_wet_and_dry_mixtures:
    agent: false
    description: Gradually integrate the wet mixture into the dry base.
    name: combine_wet_and_dry_mixtures
    nodes_depended_on:
    - prepare_base_powders
    - mix_wet_ingredients
    nodes_dependent_on:
    - pack_molds
    prompt: Very slowly whisk the wet mixture into the dry bowl, adding only a few
      drops at a time. The goal is to avoid triggering the fizz reaction prematurely.
      Stop adding the liquid when the mixture clumps together when squeezed in your
      hand; it should feel like wet sand.
  cure_and_unmold:
    agent: false
    description: Allow the bath bombs to harden before removing from molds.
    name: cure_and_unmold
    nodes_depended_on:
    - pack_molds
    nodes_dependent_on: []
    prompt: Let the filled molds sit in a dry place for at least 2 to 4 hours until
      hard. Once set, carefully tap the mold to release the bath bomb.
  mix_wet_ingredients:
    agent: false
    description: Combine the essential oils and liquid binding agents.
    name: mix_wet_ingredients
    nodes_depended_on: []
    nodes_dependent_on:
    - combine_wet_and_dry_mixtures
    prompt: In a separate small bowl, combine 2 1/2 tablespoons of almond oil (or
      olive oil), 1 teaspoon of water, and 10-15 drops of your chosen essential oil
      fragrance.
  pack_molds:
    agent: false
    description: Transfer the mixture into bath bomb molds.
    name: pack_molds
    nodes_depended_on:
    - combine_wet_and_dry_mixtures
    nodes_dependent_on:
    - cure_and_unmold
    prompt: Immediately pack the mixture tightly into your bath bomb molds. Overfill
      each side slightly, then press the two halves together firmly to squeeze excess
      mixture and create a seal.
  prepare_base_powders:
    agent: false
    description: Measure and combine the foundational dry ingredients.
    name: prepare_base_powders
    nodes_depended_on: []
    nodes_dependent_on:
    - mix_wet_ingredients
    prompt: In a large mixing bowl, measure and combine 1 cup of baking soda, 1/2
      cup of citric acid, and 1/2 cup of cornstarch. Mix thoroughly to ensure an even
      distribution of the powders.
