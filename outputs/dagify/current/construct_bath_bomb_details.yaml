dag_type: plain_text
description: A workflow to construct bath bombs by measuring ingredients, mixing wet
  and dry components separately, combining them, and molding the final product.
name: construct_bath_bomb
nodes:
  combine_base_powders:
    agent: false
    description: Thoroughly mix the measured dry ingredients to ensure an even distribution.
    name: combine_base_powders
    nodes_depended_on:
    - measure_base_powders
    nodes_dependent_on:
    - integrate_wet_mix
    prompt: In a large mixing bowl, combine the measured baking soda, citric acid,
      and cornstarch. Mix the powders thoroughly until the color and texture are uniform.
  cure_and_unmold:
    agent: false
    description: Allow the bath bombs to harden and remove them from the molds.
    name: cure_and_unmold
    nodes_depended_on:
    - pack_molds
    nodes_dependent_on: []
    prompt: Let the filled molds sit in a dry place for at least 2 to 4 hours until
      hard. Once set, carefully tap the mold to release the bath bomb.
  integrate_wet_mix:
    agent: false
    description: Gradually incorporate the wet liquid mixture into the dry base powder.
    name: integrate_wet_mix
    nodes_depended_on:
    - combine_base_powders
    - mix_wet_ingredients
    nodes_dependent_on:
    - pack_molds
    prompt: Very slowly whisk the prepared wet mixture into the bowl containing the
      dry powders. Add only a few drops at a time to avoid triggering the fizz reaction.
      Stop mixing when the mixture clumps together when squeezed; it should feel like
      wet sand.
  measure_base_powders:
    agent: false
    description: Measure the solid dry base ingredients for the bath bomb.
    name: measure_base_powders
    nodes_depended_on: []
    nodes_dependent_on:
    - combine_base_powders
    prompt: Measure out 1 cup of baking soda, 1/2 cup of citric acid, and 1/2 cup
      of cornstarch. Ensure all measurements are level and accurate.
  measure_wet_ingredients:
    agent: false
    description: Measure the liquid binding agents and essential oils.
    name: measure_wet_ingredients
    nodes_depended_on: []
    nodes_dependent_on:
    - mix_wet_ingredients
    prompt: Measure 2 1/2 tablespoons of almond oil (or olive oil), 1 teaspoon of
      water, and 10-15 drops of your chosen essential oil.
  mix_wet_ingredients:
    agent: false
    description: Combine the measured liquid components into a uniform mixture.
    name: mix_wet_ingredients
    nodes_depended_on:
    - measure_wet_ingredients
    nodes_dependent_on:
    - integrate_wet_mix
    prompt: In a separate small bowl, combine the measured almond oil, water, and
      essential oil fragrance. Stir gently to mix the liquids evenly.
  pack_molds:
    agent: false
    description: Transfer the final bath bomb mixture into molds to set the shape.
    name: pack_molds
    nodes_depended_on:
    - integrate_wet_mix
    nodes_dependent_on:
    - cure_and_unmold
    prompt: Immediately and tightly pack the mixture into your bath bomb molds. Overfill
      each side slightly, then press the two halves together firmly to squeeze out
      excess mixture and create a seal.
