    code_node_type: stub
    description: Analyze factor exposures, drawdown drivers, and stress scenarios
      for the strategy.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass OptimizePortfolioOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ optimize_portfolio node outputs.\"\"\"\n    optimal_date: str = (\n      \
      \  Field(..., description=\"The date for which the optimal weights are computed\"\
      )\n    )\n    weight_vector: List[float] = (\n        Field(..., description=\"\
      Optimal portfolio weights for each security in the universe, ordered consistently\
      \ with the input signal vector\")\n    )\n    gross_exposure: float = (\n  \
      \      Field(..., description=\"Sum of absolute values of the optimal weights,\
      \ representing total gross position size\")\n    )\n    net_exposure: float\
      \ = (\n        Field(..., description=\"Sum of the optimal weights, representing\
      \ net dollar exposure after market\\u2011neutral constraints\")\n    )\n\n\n\
      class ComputeFactorExposuresOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ compute_factor_exposures node outputs.\"\"\"\n    factor_names: List[str]\
      \ = (\n        Field(..., description=\"List of all factor names computed for\
      \ each security-day\")\n    )\n    factor_calculation_descriptions: List[str]\
      \ = (\n        Field(..., description=\"For each factor, a brief description\
      \ of the calculation method (e.g., ratio, ranking)\")\n    )\n    factor_column_schema:\
      \ str = (\n        Field(..., description=\"Text representation of the table\
      \ schema for the factor columns (e.g., \\\"factor_name: float, calculation:\
      \ str\\\")\")\n    )\n    total_factor_columns: int = (\n        Field(...,\
      \ description=\"Total number of factor columns generated across all securities\
      \ and dates\")\n    )\n\n\nclass RiskAnalysisOutput(BaseModel):\n    \"\"\"\
      Pydantic model for risk_analysis node outputs.\"\"\"\n    factor_names: List[str]\
      \ = (\n        Field(..., description=\"Names of the selected factors evaluated.\"\
      )\n    )\n    average_exposure: List[float] = (\n        Field(..., description=\"\
      Average portfolio exposure to each factor over the back\\u2011test period.\"\
      )\n    )\n    max_drawdown: float = (\n        Field(..., description=\"Maximum\
      \ observed portfolio drawdown during the back\\u2011test.\")\n    )\n    top_drawdown_contributors:\
      \ List[str] = (\n        Field(..., description=\"Factors identified as the\
      \ largest contributors to the maximum drawdown.\")\n    )\n    drawdown_sensitivity:\
      \ List[float] = (\n        Field(..., description=\"Estimated change in portfolio\
      \ return per unit change in each factor during the drawdown period.\")\n   \
      \ )\n    stress_factor_names: List[str] = (\n        Field(..., description=\"\
      Names of factors used in the \\u00b12\\u03c3 stress test.\")\n    )\n    stress_sensitivity_positive:\
      \ List[float] = (\n        Field(..., description=\"Portfolio return sensitivity\
      \ when each factor is shocked +2\\u03c3.\")\n    )\n    stress_sensitivity_negative:\
      \ List[float] = (\n        Field(..., description=\"Portfolio return sensitivity\
      \ when each factor is shocked -2\\u03c3.\")\n    )\n\n\ndef risk_analysis(optimize_portfolio_input:\
      \ OptimizePortfolioOutput, compute_factor_exposures_input: ComputeFactorExposuresOutput,\
      \ **kwargs) -> RiskAnalysisOutput:\n    \"\"\"\n    Analyze portfolio factor\
      \ exposures, identify main drawdown contributors, and\n    perform ±2σ stress\
      \ tests on factor sensitivities using back-test data and\n    factor exposures.\n\
      \n    Parameters\n    ----------\n    backtest_returns : List[float]\n     \
      \   Time series of portfolio daily returns from the back-test period.\n    portfolio_weights\
      \ : List[List[float]]\n        Daily portfolio weights for each security, aligned\
      \ with factor\n        exposures.\n    factor_exposures : Dict[str, List[List[float]]]\n\
      \        Dictionary mapping each factor name to its exposure matrix over\n \
      \       securities and dates.\n    factor_stddevs : Dict[str, float]\n     \
      \   Standard deviation values of each factor over the back-test period\n   \
      \     used for stress shocks.\n\n    Returns\n    -------\n    Dict[str, Any]\n\
      \        Dictionary containing: factor names; average exposures per factor;\n\
      \        maximum portfolio drawdown; top contributing factors to drawdown;\n\
      \        drawdown period factor sensitivities; and stress test sensitivities\n\
      \        for ±2σ shocks.\n\n    Raises\n    ------\n    ValueError\n       \
      \ If input arrays have inconsistent lengths or missing data.\n    RuntimeError\n\
      \        If drawdown or stress test computations fail due to data issues.\n\n\
      \    Examples\n    --------\n    >>> backtest_returns = [-0.005, -0.01, 0.002,\
      \ 0.001, -0.007]\n    >>> portfolio_weights = [[0.1, -0.1], [0.12, -0.12], [0.11,\
      \ -0.11], [0.13,\n    -0.13], [0.1, -0.1]]\n    >>> factor_exposures = {\n \
      \   ...     'Momentum': [[0.5, 0.4], [0.52, 0.42], [0.5, 0.41], [0.49, 0.43],\n\
      \    [0.51, 0.4]],\n    ...     'Value': [[-0.3, -0.25], [-0.31, -0.26], [-0.29,\
      \ -0.24], [-0.3,\n    -0.25], [-0.28, -0.26]]\n    >>> }\n    >>> factor_stddevs\
      \ = {'Momentum': 0.1, 'Value': 0.05}\n    >>> results = risk_analysis(backtest_returns,\
      \ portfolio_weights,\n    factor_exposures, factor_stddevs)\n    >>> print(results['factor_names'])\n\
      \    >>> print(results['max_drawdown'])\n    ['Momentum', 'Value']\n    -0.015\n\
      \n    >>> # The output includes average factor exposures, drawdown contributors,\n\
      \    and stress test sensitivities in structured lists.\n    {\" +\n       \
      \             \"\"average_exposure\": [0.5, -0.3], \" +\n                  \
      \  \"\"top_drawdown_contributors\": [\"Momentum\"], \" +\n                 \
      \   \"\"stress_sensitivity_positive\": [-0.03, 0.01]\" +\n                 \
      \   \n\n    \"\"\"\n    return RiskAnalysisOutput(\n        factor_names=[],\n\
      \        average_exposure=[],\n        max_drawdown=0.0,\n        top_drawdown_contributors=[],\n\
      \        drawdown_sensitivity=[],\n        stress_factor_names=[],\n       \
      \ stress_sensitivity_positive=[],\n        stress_sensitivity_negative=[],\n\
      \    )"
