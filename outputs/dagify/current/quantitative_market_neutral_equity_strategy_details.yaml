      \ 0.5, 'value': -0.1}, 'MSFT':\n    {'momentum': 0.3, 'value': 0.0}},\n    ...\
      \         '2023-01-03': {'AAPL': {'momentum': 0.6, 'value': -0.05},\n    'MSFT':\
