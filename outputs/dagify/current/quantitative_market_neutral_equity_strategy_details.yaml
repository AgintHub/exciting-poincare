      \ description=\"Comma-separated list of data fields to retrieve from fundamental\
      \ providers\")\n    )\n    alternative_data_sources: List[str] = (\n       \
      \ Field(..., description=\"List of provider names for alternative data\")\n\
      \    )\n    alternative_fields: List[str] = (\n        Field(..., description=\"\
      Comma-separated list of data fields to retrieve from alternative data providers\"\
      )\n    )\n\n\nclass DefineUniverseCriteriaOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for define_universe_criteria node outputs.\"\"\"\n    market_cap_min:\
      \ float = (\n        Field(..., description=\"Minimum market capitalization\
      \ in USD (e.g., 5000000000 for $5B)\")\n    )\n    market_cap_max: float = (\n\
      \        Field(..., description=\"Maximum market capitalization in USD (e.g.,\
      \ 100000000000 for $100B)\")\n    )\n    avg_daily_volume_min: float = (\n \
      \       Field(..., description=\"Minimum average daily trading volume in shares\
      \ (e.g., 5000000)\")\n    )\n    price_min: float = (\n        Field(..., description=\"\
      Minimum stock price in USD (e.g., 5.0)\")\n    )\n    price_max: float = (\n\
      \        Field(..., description=\"Maximum stock price in USD (e.g., 150.0)\"\
      )\n    )\n    exchanges: List[str] = (\n        Field(..., description=\"List\
      \ of allowed listing exchanges (e.g., ['NYSE', 'NASDAQ'])\")\n    )\n    positive_earnings:\
      \ bool = (\n        Field(..., description=\"Whether to filter for securities\
      \ with positive earnings\")\n    )\n\n\nclass AcquireAlternativeDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for acquire_alternative_data node outputs.\"\"\"\n\
      \    security_ids: List[str] = (\n        Field(..., description=\"List of security\
      \ identifiers (e.g., ticker symbols or ISINs) for which data was retrieved.\"\
      )\n    )\n    retrieval_dates: List[str] = (\n        Field(..., description=\"\
      List of dates (YYYY-MM-DD) for which alternative data was downloaded.\")\n \
      \   )\n    data_sources: List[str] = (\n        Field(..., description=\"List\
      \ of data provider names used for the alternative data download.\")\n    )\n\
      \    data_fields: List[str] = (\n        Field(..., description=\"List of alternative\
      \ data fields retrieved (e.g., news_sentiment, google_trends, esg_score, analyst_forecast).\"\
      )\n    )\n    summary_statement: str = (\n        Field(..., description=\"\
      Brief statement summarizing the acquisition, including coverage period, number\
      \ of securities, and total data points.\")\n    )\n\n\ndef acquire_alternative_data(identify_data_sources_input:\
      \ IdentifyDataSourcesOutput, define_universe_criteria_input: DefineUniverseCriteriaOutput,\
      \ **kwargs) -> AcquireAlternativeDataOutput:\n    \"\"\"\n    Download daily\
      \ alternative data signals for the screened security universe\n    over the\
      \ past decade.\n\n    Parameters\n    ----------\n    security_ids : List[str]\n\
      \        Identifiers of securities selected by the universe criteria.\n    data_sources\
      \ : List[str]\n        Provider names specified by identify_data_sources for\
      \ alternative\n        data.\n    data_fields : List[str]\n        Fields requested\
      \ from each provider (e.g., news_sentiment,\n        google_trends).\n    start_date\
      \ : str\n        ISO 8601 date marking the beginning of the 10‑year coverage\
      \ window.\n    end_date : str\n        ISO 8601 date marking the end of the\
      \ 10‑year coverage window.\n\n    Returns\n    -------\n    dict\n        Dictionary\
      \ containing lists of identifiers, dates, sources, fields,\n        and a summary\
      \ statement.\n\n    Raises\n    ------\n    ValueError\n        If no security\
      \ IDs are provided or data_sources list is empty.\n    RuntimeError\n      \
      \  If a provider returns an error or fails to supply data for the\n        requested\
      \ period.\n\n    Examples\n    --------\n    >>> result = acquire_alternative_data(\n\
      \    ...     security_ids=['AAPL', 'MSFT'],\n    ...     data_sources=['NewsAPI',\
      \ 'GoogleTrends', 'ESGData'],\n    ...     data_fields=['news_sentiment', 'google_trends',\
      \ 'esg_score'],\n    ...     start_date='2014-01-01',\n    ...     end_date='2024-01-01')\n\
      \    {'security_ids': ['AAPL', 'MSFT'], 'retrieval_dates': ['2014-01-01',\n\
      \    '2024-01-01'], 'data_sources': ['NewsAPI', 'GoogleTrends', 'ESGData'],\n\
      \    'data_fields': ['news_sentiment', 'google_trends', 'esg_score'],\n    'summary_statement':\
      \ 'Downloaded 2,000,000 alternative data points for 2\n    securities from 2014-01-01\
      \ to 2024-01-01.'}\n\n    >>> result = acquire_alternative_data(\n    ...  \
      \   security_ids=['TSLA'],\n    ...     data_sources=['AnalystForecast'],\n\
      \    ...     data_fields=['analyst_forecast'],\n    ...     start_date='2015-01-01',\n\
      \    ...     end_date='2024-01-01')\n    {'security_ids': ['TSLA'], 'retrieval_dates':\
      \ ['2015-01-01', '2024-01-01'],\n    'data_sources': ['AnalystForecast'], 'data_fields':\
      \ ['analyst_forecast'],\n    'summary_statement': 'Downloaded 3,650 data points\
      \ for TSLA from 2015-01-01\n    to 2024-01-01.'}\n\n    \"\"\"\n    return AcquireAlternativeDataOutput(\n\
      \        security_ids=[],\n        retrieval_dates=[],\n        data_sources=[],\n\
      \        data_fields=[],\n        summary_statement=\"\",\n    )"
