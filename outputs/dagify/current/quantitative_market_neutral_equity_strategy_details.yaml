          name: data_fields
          type: List[str]
        - description: ISO 8601 date marking the beginning of the 10‑year coverage
            window.
          name: start_date
          type: str
        - description: ISO 8601 date marking the end of the 10‑year coverage window.
          name: end_date
          type: str
        raises:
        - description: If no security IDs are provided or data_sources list is empty.
          type: ValueError
        - description: If a provider returns an error or fails to supply data for
            the requested period.
          type: RuntimeError
        returns:
          description: Dictionary containing lists of identifiers, dates, sources,
