      \  ...     price_min=1.0,\n    ...     price_max=50.0,\n    ...     exchanges=['AMEX'],\n\
      \    ...     positive_earnings=False\n    >>> )\n    >>> print(screening_criteria)\n\
      \    {'market_cap_min': 100000000.0, 'market_cap_max': 5000000000.0,\n    'avg_daily_volume_min':\
