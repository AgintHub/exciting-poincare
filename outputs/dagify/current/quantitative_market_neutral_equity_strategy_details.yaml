        parameters:
        - description: Cleaned price data including daily price and corporate action
            adjusted fields, indexed or containing security identifier and date.
          name: price_data
          type: DataFrame
        - description: Cleaned fundamental accounting data standardized to consistent
            units, aligned to calendar dates, indexed or containing security identifier
            and date.
          name: fundamental_data
          type: DataFrame
        - description: Cleaned alternative data series with aligned timestamps and
            winsorized values, indexed or containing security identifier and date.
          name: alternative_data
          type: DataFrame
        raises:
        - description: If any input dataset is empty or missing required columns such
            as 'security_id' or 'date'.
          type: ValueError
        - description: If the join operation fails due to incompatible indices or
            unmatched key columns.
          type: MergeError
        returns:
          description: 'A dictionary containing: total_rows (int), total_columns (int),
            column_names (List[str]), is_successful (bool), and merge_summary (str),
            summarizing the resulting merged dataset.'
          type: dict
        summary: Merge cleaned price, fundamental, and alternative datasets on security
          identifier and date to produce a unified panel dataset with combined features.
    prompt: Join the three cleaned datasets on security identifier and date to produce
