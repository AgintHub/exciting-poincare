      \    \"\"\"Pydantic model for acquire_fundamental_data node outputs.\"\"\"\n\
      \    fundamental_data_fields: List[str] = (\n        Field(..., description=\"\
      List of fundamental data fields retrieved (e.g., earnings per share, book value,\
