      \ = (\n        Field(..., description=\"Annualized Sharpe ratio of the model\\\
      u2019s strategy during the holdout period.\")\n    )\n    maximum_drawdown:\
      \ float = (\n        Field(..., description=\"Maximum drawdown (as a negative\
      \ decimal) of the model\\u2019s strategy during the holdout period.\")\n   \
      \ )\n    information_ratio: float = (\n        Field(..., description=\"Information\
      \ ratio of the model\\u2019s strategy during the holdout period.\")\n    )\n\
      \n\nclass SelectBestModelOutput(BaseModel):\n    \"\"\"Pydantic model for select_best_model\
      \ node outputs.\"\"\"\n    selected_model: str = (\n        Field(..., description=\"\
      Name of the model selected as best performer\")\n    )\n    information_ratio:\
