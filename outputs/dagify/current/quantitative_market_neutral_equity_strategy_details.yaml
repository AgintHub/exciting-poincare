      \ True}\n\n    \"\"\"\n    return AcquireFundamentalDataOutput(\n        fundamental_data_fields=[],\n\
      \        data_coverage=\"\",\n        number_of_securities=0,\n        data_retrieval_status=False,\n\
      \    )"
