      \    >>> import pandas as pd\n    >>> signals = generate_signals(\n    ... \
      \    selected_model_name='LinearRegression',\n    ...     factor_exposures=factor_exposure_df,\n\
      \    ...     model_object=linreg_model_instance\n    >>> )\n    {'date_range_start':\
