      \ str = (\n        Field(..., description=\"Key metric used to assess execution\
      \ quality (e.g., VWAP deviation %, Execution Slippage %)\")\n    )\n\n\nclass\
      \ DevelopComplianceChecksOutput(BaseModel):\n    \"\"\"Pydantic model for develop_compliance_checks\
      \ node outputs.\"\"\"\n    compliance_rule_names: List[str] = (\n        Field(...,\
      \ description=\"Names of each compliance rule (e.g., Position Limit, Sector\
      \ Concentration, Short\\u2011Selling Restriction, Leverage Cap, Reporting Obligation).\"\
