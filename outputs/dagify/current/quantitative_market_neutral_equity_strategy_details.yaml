      \      Field(..., description=\"Sum of absolute values of the optimal weights,\
      \ representing total gross position size\")\n    )\n    net_exposure: float\
      \ = (\n        Field(..., description=\"Sum of the optimal weights, representing\
      \ net dollar exposure after market\\u2011neutral constraints\")\n    )\n\n\n\
      class DefineMarketNeutralObjectivesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for define_market_neutral_objectives node outputs.\"\"\"\n    neutrality_criteria:\
      \ List[str] = (\n        Field(..., description=\"List of individual market\\\
      u2011neutral criteria expressed as bullet points, e.g., \\\"Beta exposure =\
      \ 0\\\", \\\"Dollar exposure = 0\\\", \\\"Sector neutrality\\\", \\\"Factor\
      \ X neutrality\\\".\")\n    )\n    is_valid: bool = (\n        Field(..., description=\"\
      Indicates whether the defined criteria meet the strategy's overall neutrality\
      \ requirements.\")\n    )\n\n\nclass DesignExecutionStrategyOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for design_execution_strategy node outputs.\"\"\"\n\
      \    algorithm_name: str = (\n        Field(..., description=\"Name of the execution\
      \ algorithm (e.g., VWAP, TWAP, Implementation Shortfall)\")\n    )\n    strategy_type:\
      \ str = (\n        Field(..., description=\"Broad classification of the strategy\
      \ (e.g., Market\\u2011Milking, Time\\u2011Weighted, Volume\\u2011Weighted)\"\
      )\n    )\n    participation_rate: float = (\n        Field(..., description=\"\
      Maximum percentage of the daily trading volume to participate in for any single\
      \ security\")\n    )\n    slice_frequency_minutes: int = (\n        Field(...,\
      \ description=\"Time interval in minutes between successive child order slices\"\
      )\n    )\n    child_order_weights: List[float] = (\n        Field(..., description=\"\
      Sequence of target weights to be applied in each child order slice, matching\
      \ the order_time_stamps list\")\n    )\n    order_time_stamps: List[str] = (\n\
      \        Field(..., description=\"ISO 8601 timestamps indicating when each child\
      \ order slice is scheduled to be sent\")\n    )\n    execution_quality_metric:\
      \ str = (\n        Field(..., description=\"Key metric used to assess execution\
      \ quality (e.g., VWAP deviation %, Execution Slippage %)\")\n    )\n\n\ndef\
      \ design_execution_strategy(optimize_portfolio_input: OptimizePortfolioOutput,\
      \ define_market_neutral_objectives_input: DefineMarketNeutralObjectivesOutput,\
      \ **kwargs) -> DesignExecutionStrategyOutput:\n    \"\"\"\n    Generates an\
      \ execution algorithm strategy converting daily target portfolio\n    weights\
      \ into time-sliced child orders with participation constraints,\n    supporting\
      \ minimal market impact and quality monitoring.\n\n    Parameters\n    ----------\n\
      \    algorithm_name : str\n        The name of the execution algorithm to be\
      \ used, e.g., 'VWAP',\n        'TWAP', or 'Implementation Shortfall'.\n    strategy_type\
      \ : str\n        The broad classification of the execution strategy, such as\
