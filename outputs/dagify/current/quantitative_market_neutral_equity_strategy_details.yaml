  acquire_price_data:
    agent: false
    code_node_type: stub
    description: Download historical price data for the screened equity universe.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass IdentifyDataSourcesOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ identify_data_sources node outputs.\"\"\"\n    market_price_data_sources:\
      \ List[str] = (\n        Field(..., description=\"List of provider names for\
      \ market price data\")\n    )\n    market_price_fields: List[str] = (\n    \
      \    Field(..., description=\"Comma-separated list of data fields to retrieve\
      \ from market price providers\")\n    )\n    fundamental_data_sources: List[str]\
      \ = (\n        Field(..., description=\"List of provider names for fundamental\
      \ financial data\")\n    )\n    fundamental_fields: List[str] = (\n        Field(...,\
      \ description=\"Comma-separated list of data fields to retrieve from fundamental\
      \ providers\")\n    )\n    alternative_data_sources: List[str] = (\n       \
      \ Field(..., description=\"List of provider names for alternative data\")\n\
      \    )\n    alternative_fields: List[str] = (\n        Field(..., description=\"\
      Comma-separated list of data fields to retrieve from alternative data providers\"\
      )\n    )\n\n\nclass DefineUniverseCriteriaOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for define_universe_criteria node outputs.\"\"\"\n    market_cap_min:\
      \ float = (\n        Field(..., description=\"Minimum market capitalization\
      \ in USD (e.g., 5000000000 for $5B)\")\n    )\n    market_cap_max: float = (\n\
      \        Field(..., description=\"Maximum market capitalization in USD (e.g.,\
      \ 100000000000 for $100B)\")\n    )\n    avg_daily_volume_min: float = (\n \
      \       Field(..., description=\"Minimum average daily trading volume in shares\
      \ (e.g., 5000000)\")\n    )\n    price_min: float = (\n        Field(..., description=\"\
      Minimum stock price in USD (e.g., 5.0)\")\n    )\n    price_max: float = (\n\
      \        Field(..., description=\"Maximum stock price in USD (e.g., 150.0)\"\
      )\n    )\n    exchanges: List[str] = (\n        Field(..., description=\"List\
      \ of allowed listing exchanges (e.g., ['NYSE', 'NASDAQ'])\")\n    )\n    positive_earnings:\
      \ bool = (\n        Field(..., description=\"Whether to filter for securities\
      \ with positive earnings\")\n    )\n\n\nclass AcquirePriceDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for acquire_price_data node outputs.\"\"\"\n    start_date:\
      \ str = (\n        Field(..., description=\"Earliest date of the price data\
      \ series (YYYY-MM-DD).\")\n    )\n    end_date: str = (\n        Field(...,\
      \ description=\"Most recent date of the price data series (YYYY-MM-DD).\")\n\
      \    )\n    num_securities: int = (\n        Field(..., description=\"Total\
      \ number of securities for which price data was retrieved.\")\n    )\n    security_ids:\
      \ List[str] = (\n        Field(..., description=\"List of unique identifiers\
      \ (e.g., ticker or CUSIP) for each security in the dataset.\")\n    )\n    columns_retrieved:\
      \ List[str] = (\n        Field(..., description=\"List of column names that\
      \ were retrieved (e.g., adjusted_close, open, high, low, volume, split_factor).\"\
      )\n    )\n    summary_statement: str = (\n        Field(..., description=\"\
      A concise statement confirming the date range and number of securities, e.g.,\
      \ \\\"Downloaded price data for 1,234 securities from 2013-01-02 to 2023-01-02.\\\
      \"\")\n    )\n\n\ndef acquire_price_data(identify_data_sources_input: IdentifyDataSourcesOutput,\
      \ define_universe_criteria_input: DefineUniverseCriteriaOutput, **kwargs) ->\
      \ AcquirePriceDataOutput:\n    \"\"\"\n    Retrieve 10‑year daily market price\
      \ history for the screened equity\n    universe.\n\n    Parameters\n    ----------\n\
      \    price_sources : List[str]\n        List of market‑price data provider names\
      \ returned by\n        identify_data_sources.\n    fields : List[str]\n    \
      \    List of price fields to request from each provider (e.g.,\n        ['adjusted_close',\
      \ 'open', 'high', 'low', 'volume',\n        'split_factor']).\n    universe\
      \ : Dict[str, Any]\n        Dictionary containing universe screening criteria\
      \ returned by\n        define_universe_criteria.\n    start_date : str\n   \
      \     Start of the 10‑year period to download (ISO format).\n    end_date :\
      \ str\n        End of the 10‑year period to download (ISO format).\n\n    Returns\n\
      \    -------\n    Dict[str, Any]\n        A dictionary matching the output_structure,\
      \ containing metadata and\n        a summary statement.\n\n    Raises\n    ------\n\
      \    ValueError\n        If any required input list is empty or the date range\
      \ is invalid.\n    ConnectionError\n        If a data provider cannot be reached\
      \ or returns an authentication\n        error.\n    RuntimeError\n        If\
      \ the number of securities returned is zero, indicating a mismatch\n       \
      \ between universe criteria and available data.\n\n    Examples\n    --------\n\
      \    >>> price_sources = ['AlphaVantage', 'Polygon']\n    >>> fields = ['adjusted_close',\
      \ 'open', 'high', 'low', 'volume',\n    'split_factor']\n    >>> universe =\
      \ {\"market_cap_min\": 5e9, \"market_cap_max\": 1e11,\n    \"avg_daily_volume_min\"\
      : 5e6, \"price_min\": 5.0, \"price_max\": 150.0,\n    \"exchanges\": [\"NASDAQ\"\
      , \"NYSE\"], \"positive_earnings\": True}\n    >>> result = acquire_price_data(price_sources,\
      \ fields, universe,\n    '2013-01-02', '2023-01-02')\n    {'start_date': '2013-01-02',\
      \ 'end_date': '2023-01-02', 'num_securities':\n    1123, 'security_ids': ['AAPL',\
      \ 'MSFT', 'GOOG'], 'columns_retrieved':\n    ['adjusted_close', 'open', 'high',\
      \ 'low', 'volume', 'split_factor'],\n    'summary_statement': 'Downloaded price\
      \ data for 1,123 securities from\n    2013-01-02 to 2023-01-02.'}\n\n    >>>\
      \ acquire_price_data([], fields, universe, '2013-01-02', '2023-01-02')\n   \
      \ ValueError: Input list price_sources cannot be empty.\n\n    \"\"\"\n    return\
      \ AcquirePriceDataOutput(\n        start_date=\"\",\n        end_date=\"\",\n\
      \        num_securities=0,\n        security_ids=[],\n        columns_retrieved=[],\n\
      \        summary_statement=\"\",\n    )"
    name: acquire_price_data
    nodes_depended_on:
    - identify_data_sources
    - define_universe_criteria
