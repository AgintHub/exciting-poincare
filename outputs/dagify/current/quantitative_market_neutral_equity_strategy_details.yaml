          - factor_exposures = {
          - '    ''Momentum'': [[0.5, 0.4], [0.52, 0.42], [0.5, 0.41], [0.49, 0.43],
            [0.51, 0.4]],'
          - '    ''Value'': [[-0.3, -0.25], [-0.31, -0.26], [-0.29, -0.24], [-0.3,
            -0.25], [-0.28, -0.26]]'
          - '}'
