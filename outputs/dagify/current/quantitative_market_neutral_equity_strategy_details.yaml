      \        Field(..., description=\"Maximum market capitalization in USD (e.g.,\
      \ 100000000000 for $100B)\")\n    )\n    avg_daily_volume_min: float = (\n \
      \       Field(..., description=\"Minimum average daily trading volume in shares\
      \ (e.g., 5000000)\")\n    )\n    price_min: float = (\n        Field(..., description=\"\
