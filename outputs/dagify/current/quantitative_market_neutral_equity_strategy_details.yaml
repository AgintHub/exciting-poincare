      \ define_transaction_cost_model_input: DefineTransactionCostModelOutput, **kwargs)\
      \ -> OptimizePortfolioOutput:\n    \"\"\"\n    Compute the optimal portfolio\
      \ weights that maximize predicted returns net of\n    transaction costs under\
      \ predefined constraints for a specified date.\n\n    Parameters\n    ----------\n\
      \    signal_vector : List[float]\n        Predicted excess return signals for\
      \ each security on the\n        optimization date, aligned with the portfolio\
      \ universe.\n    constraints : Dict[str, Any]\n        A dictionary encapsulating\
      \ portfolio constraints such as net beta\n        target, dollar exposure target,\
      \ sector neutrality flag, maximum\n        position size percentage, minimum\
      \ liquidity threshold, factor names,\n        and factor exposure limits.\n\
      \    transaction_costs : Dict[str, float]\n        Parameters of the transaction\
      \ cost model including commission per\n        share, bid-ask spread percentage,\
      \ and market impact factor.\n    current_positions : List[float]\n        Current\
      \ portfolio weights for each security, used to compute\n        transaction\
      \ costs related to rebalancing.\n    date : str\n        The specific date (ISO\
      \ format YYYY-MM-DD) for which to compute the\n        optimal portfolio weights.\n\
      \n    Returns\n    -------\n    Dict[str, Any]\n        A dictionary containing:\
      \ 'optimal_date' the optimization date;\n        'weight_vector' list of floats\
      \ for optimal security weights;\n        'gross_exposure' total absolute exposure\
      \ float; 'net_exposure' net\n        dollar exposure float.\n\n    Raises\n\
      \    ------\n    ValueError\n        Raised if input vectors lengths do not\
      \ match or if constraints are\n        not properly specified.\n    OptimizationError\n\
      \        Raised if the quadratic programming solver fails to find a feasible\n\
      \        or optimal solution.\n\n    Examples\n    --------\n    >>> signal_vector\
      \ = [0.02, 0.01, -0.01]\n    >>> constraints = {\n    ...     'net_beta_target':\
      \ 0.0,\n    ...     'dollar_exposure_target': 0.0,\n    ...     'sector_neutrality':\
