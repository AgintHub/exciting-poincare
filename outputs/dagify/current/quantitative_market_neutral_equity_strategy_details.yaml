      docstring:
        examples:
        - lines:
          - backtest_returns = [-0.005, -0.01, 0.002, 0.001, -0.007]
          - portfolio_weights = [[0.1, -0.1], [0.12, -0.12], [0.11, -0.11], [0.13,
