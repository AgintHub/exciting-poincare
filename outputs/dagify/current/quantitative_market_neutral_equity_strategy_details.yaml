        - lines:
          - result = acquire_alternative_data(
          - '    security_ids=[''AAPL'', ''MSFT''],'
          - '    data_sources=[''NewsAPI'', ''GoogleTrends'', ''ESGData''],'
          - '    data_fields=[''news_sentiment'', ''google_trends'', ''esg_score''],'
          - '    start_date=''2014-01-01'','
          - '    end_date=''2024-01-01'')'
          output: '{''security_ids'': [''AAPL'', ''MSFT''], ''retrieval_dates'': [''2014-01-01'',
            ''2024-01-01''], ''data_sources'': [''NewsAPI'', ''GoogleTrends'', ''ESGData''],
            ''data_fields'': [''news_sentiment'', ''google_trends'', ''esg_score''],
            ''summary_statement'': ''Downloaded 2,000,000 alternative data points
            for 2 securities from 2014-01-01 to 2024-01-01.''}'
        - lines:
          - result = acquire_alternative_data(
          - '    security_ids=[''TSLA''],'
          - '    data_sources=[''AnalystForecast''],'
          - '    data_fields=[''analyst_forecast''],'
          - '    start_date=''2015-01-01'','
          - '    end_date=''2024-01-01'')'
          output: '{''security_ids'': [''TSLA''], ''retrieval_dates'': [''2015-01-01'',
            ''2024-01-01''], ''data_sources'': [''AnalystForecast''], ''data_fields'':
            [''analyst_forecast''], ''summary_statement'': ''Downloaded 3,650 data
            points for TSLA from 2015-01-01 to 2024-01-01.''}'
        parameters:
        - description: Identifiers of securities selected by the universe criteria.
          name: security_ids
          type: List[str]
        - description: Provider names specified by identify_data_sources for alternative
            data.
          name: data_sources
          type: List[str]
        - description: Fields requested from each provider (e.g., news_sentiment,
