      \    >>> data_providers = ['Yahoo Finance', 'Quandl']\n    >>> universe_criteria\
      \ = {'market_cap': 1000000000, 'liquidity': 1000000}\n    >>> result = acquire_fundamental_data(data_providers,\
      \ universe_criteria)\n    {'fundamental_data_fields': ['earnings_per_share',\
      \ 'book_value',\n    'cash_flow'], 'data_coverage': '10-year horizon, quarterly\
