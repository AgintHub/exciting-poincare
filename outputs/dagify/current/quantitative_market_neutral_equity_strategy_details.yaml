      \   Field(..., description=\"Concise summary of the overall operational workflow\"\
      )\n    )\n\n\nclass SetupMonitoringAndAlertsOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for setup_monitoring_and_alerts node outputs.\"\"\"\n    metric_names:\
      \ List[str] = (\n        Field(..., description=\"Names of the live monitoring\
      \ metrics to be tracked\")\n    )\n    threshold_values: List[float] = (\n \
      \       Field(..., description=\"Numerical alert thresholds corresponding to\
      \ each metric, expressed in the metric\\u2019s units or standard deviations\"\
      )\n    )\n    monitoring_cadence: List[str] = (\n        Field(..., description=\"\
      Cadence for each metric (e.g., \\\"real\\u2011time\\\", \\\"hourly\\\", \\\"\
      daily\\\")\")\n    )\n    notification_channels: List[str] = (\n        Field(...,\
      \ description=\"Channels to be used for alert delivery (e.g., \\\"email\\\"\
      , \\\"Slack\\\", \\\"PagerDuty\\\")\")\n    )\n\n\ndef setup_monitoring_and_alerts(draft_operational_workflow_input:\
      \ DraftOperationalWorkflowOutput, **kwargs) -> SetupMonitoringAndAlertsOutput:\n\
      \    \"\"\"\n    Configure the set of real-time monitoring metrics for live\
      \ trading, their\n    alert thresholds, monitoring cadence, and notification\
      \ channels.\n\n    Parameters\n    ----------\n    metric_names : List[str]\n\
      \        List containing the names of each metric to be actively tracked and\n\
      \        monitored during live trading (e.g., 'P&L deviation', 'Exposure\n \
      \       Limits Breached').\n    threshold_values : List[float]\n        Numerical\
      \ thresholds corresponding to each metric that if crossed\n        will trigger\
      \ an alert. Thresholds may be expressed in metric-\n        specific units or\
      \ multiples of standard deviations (e.g., 2.0 for\n        2σ). The list order\
      \ matches that of metric_names.\n    monitoring_cadence : List[str]\n      \
      \  Frequency at which each metric is evaluated, such as 'real-time' for\n  \
      \      continuous monitoring, 'hourly', or 'daily'. This list aligns 1-to-1\n\
      \        with metric_names.\n    notification_channels : List[str]\n       \
      \ Communication channels used to send alerts upon threshold breach,\n      \
      \  for example, 'email', 'Slack', or 'PagerDuty'. Each entry\n        corresponds\
      \ to a metric.\n\n    Returns\n    -------\n    dict\n        A dictionary containing:\
      \ 'metric_names', 'threshold_values',\n        'monitoring_cadence', and 'notification_channels',\
      \ representing the\n        full configuration for live monitoring and alerting.\n\
      \n    Raises\n    ------\n    ValueError\n        If the input lists are of\
      \ mismatched lengths or if threshold values\n        are not numeric.\n\n  \
      \  Examples\n    --------\n    >>> metrics = ['P&L Deviation', 'Exposure Breach',\
      \ 'Latency', 'Execution\n    Slippage']\n    >>> thresholds = [2.0, 0.0, 200.0,\
      \ 0.05]\n    >>> cadence = ['real-time', 'real-time', 'hourly', 'daily']\n \
      \   >>> channels = ['Slack', 'PagerDuty', 'Email', 'Email']\n    >>> setup_monitoring_and_alerts(metrics,\
      \ thresholds, cadence, channels)\n    {'metric_names': ['P&L Deviation', 'Exposure\
      \ Breach', 'Latency', 'Execution\n    Slippage'],\n     'threshold_values':\
      \ [2.0, 0.0, 200.0, 0.05],\n     'monitoring_cadence': ['real-time', 'real-time',\
      \ 'hourly', 'daily'],\n     'notification_channels': ['Slack', 'PagerDuty',\
      \ 'Email', 'Email']}\n\n    >>> metric_names = ['Portfolio Turnover', 'Max Drawdown']\n\
      \    >>> threshold_values = [0.1, 0.15]\n    >>> monitoring_cadence = ['daily',\
      \ 'daily']\n    >>> notification_channels = ['Email', 'Slack']\n    >>> setup_monitoring_and_alerts(metric_names,\
      \ threshold_values,\n    monitoring_cadence, notification_channels)\n    {'metric_names':\
      \ ['Portfolio Turnover', 'Max Drawdown'],\n     'threshold_values': [0.1, 0.15],\n\
      \     'monitoring_cadence': ['daily', 'daily'],\n     'notification_channels':\
      \ ['Email', 'Slack']}\n\n    \"\"\"\n    return SetupMonitoringAndAlertsOutput(\n\
      \        metric_names=[],\n        threshold_values=[],\n        monitoring_cadence=[],\n\
      \        notification_channels=[],\n    )"
