    code_node_type: stub
    description: Combine cleaned price, fundamental, and alternative data into a single
      panel dataset.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass CleanPriceDataOutput(BaseModel):\n    \"\"\"Pydantic model for clean_price_data\
      \ node outputs.\"\"\"\n    cleaned_rows: int = (\n        Field(..., description=\"\
      Total number of rows after cleaning\")\n    )\n    removed_rows: int = (\n \
      \       Field(..., description=\"Number of rows removed due to invalid or duplicate\
      \ data\")\n    )\n    cleaned_date_range: str = (\n        Field(..., description=\"\
      Date range of the cleaned dataset in ISO format (e.g., 2013-01-02 to 2023-01-01)\"\
      )\n    )\n    columns_cleaned: List[str] = (\n        Field(..., description=\"\
      List of column names that were standardized or renamed\")\n    )\n    is_clean:\
      \ bool = (\n        Field(..., description=\"Indicates whether the dataset passed\
      \ all integrity checks\")\n    )\n\n\nclass CleanFundamentalDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for clean_fundamental_data node outputs.\"\"\"\n \
      \   cleaned_record_count: int = (\n        Field(..., description=\"Total number\
      \ of fundamental records after cleaning\")\n    )\n    missing_value_records:\
      \ int = (\n        Field(..., description=\"Number of records that had missing\
      \ values before imputation\")\n    )\n    missing_value_flagged: bool = (\n\
      \        Field(..., description=\"Whether any records were flagged for missing\
      \ values after cleaning\")\n    )\n    outlier_removed_count: int = (\n    \
      \    Field(..., description=\"Number of records removed due to outlier detection\"\
      )\n    )\n    unit_consistency_flag: bool = (\n        Field(..., description=\"\
      True if all metrics were converted to consistent units\")\n    )\n    reporting_period_aligned:\
      \ bool = (\n        Field(..., description=\"True if all reporting periods were\
      \ aligned to calendar dates\")\n    )\n\n\nclass CleanAlternativeDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for clean_alternative_data node outputs.\"\"\"\n \
      \   total_records: int = (\n        Field(..., description=\"Total number of\
      \ alternative data records downloaded before cleaning.\")\n    )\n    filled_missing_days:\
      \ int = (\n        Field(..., description=\"Total number of missing days that\
      \ were filled during the cleaning process.\")\n    )\n    excluded_records:\
      \ int = (\n        Field(..., description=\"Number of records excluded due to\
      \ being outside the 1%/99% percentile after winsorization.\")\n    )\n    summary_statement:\
      \ str = (\n        Field(..., description=\"A brief textual summary of the cleaning\
      \ outcome, including date range and number of securities processed.\")\n   \
      \ )\n\n\nclass MergeCleanedDataOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for merge_cleaned_data node outputs.\"\"\"\n    total_rows: int = (\n    \
      \    Field(..., description=\"Total number of security\\u2011day observations\
      \ in the merged dataset.\")\n    )\n    total_columns: int = (\n        Field(...,\
      \ description=\"Total number of columns (features) in the merged dataset, including\
      \ identifier, date, price, fundamental, and alternative fields.\")\n    )\n\
      \    column_names: List[str] = (\n        Field(..., description=\"List of all\
      \ column names present in the merged dataset.\")\n    )\n    is_successful:\
      \ bool = (\n        Field(..., description=\"Flag indicating whether the merge\
      \ operation completed without errors.\")\n    )\n    merge_summary: str = (\n\
      \        Field(..., description=\"Short textual summary of the merge operation,\
      \ e.g., \\\"Merged 5,000 securities over 2,500 trading days with 120 columns.\\\
      \"\")\n    )\n\n\ndef merge_cleaned_data(clean_price_data_input: CleanPriceDataOutput,\
      \ clean_fundamental_data_input: CleanFundamentalDataOutput, clean_alternative_data_input:\
      \ CleanAlternativeDataOutput, **kwargs) -> MergeCleanedDataOutput:\n    \"\"\
      \"\n    Merge cleaned price, fundamental, and alternative datasets on security\n\
      \    identifier and date to produce a unified panel dataset with combined\n\
      \    features.\n\n    Parameters\n    ----------\n    price_data : DataFrame\n\
      \        Cleaned price data including daily price and corporate action\n   \
      \     adjusted fields, indexed or containing security identifier and date.\n\
      \    fundamental_data : DataFrame\n        Cleaned fundamental accounting data\
      \ standardized to consistent\n        units, aligned to calendar dates, indexed\
      \ or containing security\n        identifier and date.\n    alternative_data\
      \ : DataFrame\n        Cleaned alternative data series with aligned timestamps\
      \ and\n        winsorized values, indexed or containing security identifier\
      \ and\n        date.\n\n    Returns\n    -------\n    dict\n        A dictionary\
      \ containing: total_rows (int), total_columns (int),\n        column_names (List[str]),\
      \ is_successful (bool), and merge_summary\n        (str), summarizing the resulting\
      \ merged dataset.\n\n    Raises\n    ------\n    ValueError\n        If any\
      \ input dataset is empty or missing required columns such as\n        'security_id'\
      \ or 'date'.\n    MergeError\n        If the join operation fails due to incompatible\
      \ indices or unmatched\n        key columns.\n\n    Examples\n    --------\n\
      \    >>> merged = merge_cleaned_data(price_data, fundamental_data,\n    alternative_data)\n\
      \    >>> print(merged['total_rows'])\n    >>> print(merged['total_columns'])\n\
      \    >>> print(merged['is_successful'])\n    >>> print(merged['merge_summary'])\n\
      \    250000\n    120\n    True\n    'Merged 5000 securities over 50 trading\
      \ days with 120 columns.'\n\n    >>> # Assuming mismatched keys or empty data\
      \ triggers error\n    >>> try:\n    ...     merge_cleaned_data(empty_price_data,\
      \ fundamental_data,\n    alternative_data)\n    >>> except ValueError as e:\n\
      \    ...     print(str(e))\n    'Input price_data is empty or missing required\
      \ keys.'\n\n    \"\"\"\n    return MergeCleanedDataOutput(\n        total_rows=0,\n\
      \        total_columns=0,\n        column_names=[],\n        is_successful=False,\n\
      \        merge_summary=\"\",\n    )"
    name: merge_cleaned_data
    nodes_depended_on:
    - clean_price_data
    - clean_fundamental_data
    - clean_alternative_data
