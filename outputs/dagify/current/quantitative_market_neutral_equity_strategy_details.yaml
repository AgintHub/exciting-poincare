    implementation: "from pydantic import BaseModel, Field\n\n\nclass EvaluateModelsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for evaluate_models node outputs.\"\"\"\n    model_name:\
      \ str = (\n        Field(..., description=\"The name of the model evaluated\
      \ (e.g., LinearRegression, RandomForest, GradientBoosting).\")\n    )\n    holdout_period_years:\
      \ int = (\n        Field(..., description=\"Number of years used for the out\\\
