      \  Field(..., description=\"Whether the fundamental data retrieval was successful\"\
      )\n    )\n\n\ndef acquire_fundamental_data(identify_data_sources_input: IdentifyDataSourcesOutput,\
      \ define_universe_criteria_input: DefineUniverseCriteriaOutput, **kwargs) ->\
      \ AcquireFundamentalDataOutput:\n    \"\"\"\n    Downloads historical fundamental\
      \ accounting data for the specified universe\n    of securities.\n\n    Parameters\n\
      \    ----------\n    data_providers : List[str]\n        List of fundamental\
      \ data providers\n    universe_criteria : dict\n        Dictionary containing\
