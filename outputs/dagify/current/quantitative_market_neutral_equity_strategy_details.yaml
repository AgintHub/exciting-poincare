      \ capable of scoring or predicting\n        excess returns given factor inputs.\n\
      \n    Returns\n    -------\n    dict\n        Dictionary containing signal generation\
      \ metadata and statistics with\n        keys: 'date_range_start' (str), 'date_range_end'\
      \ (str),\n        'num_signals' (int), 'signal_mean' (float), 'signal_std' (float).\n\
      \n    Raises\n    ------\n    ValueError\n        Raised if input factor exposures\
      \ are empty or model is not properly\n        provided.\n    RuntimeError\n\
      \        Raised if signal generation fails due to mismatch in data dimensions\n\
