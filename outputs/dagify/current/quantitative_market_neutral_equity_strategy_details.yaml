      \ = '2023-08-01'\n    >>> output = optimize_portfolio(signal_vector, constraints,\n\
      \    transaction_costs, current_positions, date)\n    {\n      'optimal_date':\
      \ '2023-08-01',\n      'weight_vector': [0.04, 0.03, -0.05],\n      'gross_exposure':\
      \ 0.12,\n      'net_exposure': 0.02\n    }\n\n    >>> # For a single-day optimization\
