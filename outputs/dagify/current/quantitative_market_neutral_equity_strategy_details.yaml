      key: summary_statement
      type: str
    prd:
      conceptual_info: The acquire_price_data node fetches a complete 10‑year daily
        price history for every security that passes the universe screening rules.
        It pulls standard OHLCV fields along with corporate actions and packages the
        results into a lightweight JSON payload for downstream cleaning, cost modeling,
        and back‑testing.
      docstring:
        examples:
        - lines:
          - price_sources = ['AlphaVantage', 'Polygon']
