      \       Field(..., description=\"Mean of all predicted excess return signals.\"\
      )\n    )\n    signal_std: float = (\n        Field(..., description=\"Standard\
      \ deviation of all predicted excess return signals.\")\n    )\n\n\ndef generate_signals(select_best_model_input:\
      \ SelectBestModelOutput, compute_factor_exposures_input: ComputeFactorExposuresOutput,\
