    prd:
      conceptual_info: This node consolidates three cleaned datasets—price data, fundamental
        data, and alternative data—by joining them on the security identifier and
        date fields. The output is a comprehensive panel dataset indexed by security
        and trading day, containing combined features from all three sources, suitable
        for downstream factor computation and modeling.
      docstring:
        examples:
