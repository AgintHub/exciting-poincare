  test_factor_performance:
    agent: false
    code_node_type: stub
    description: Assess each factor’s historical predictive performance via time‑series
      regression.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ComputeFactorExposuresOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for compute_factor_exposures node outputs.\"\"\"\n    factor_names: List[str]\
      \ = (\n        Field(..., description=\"List of all factor names computed for\
      \ each security-day\")\n    )\n    factor_calculation_descriptions: List[str]\
      \ = (\n        Field(..., description=\"For each factor, a brief description\
      \ of the calculation method (e.g., ratio, ranking)\")\n    )\n    factor_column_schema:\
      \ str = (\n        Field(..., description=\"Text representation of the table\
      \ schema for the factor columns (e.g., \\\"factor_name: float, calculation:\
      \ str\\\")\")\n    )\n    total_factor_columns: int = (\n        Field(...,\
      \ description=\"Total number of factor columns generated across all securities\
      \ and dates\")\n    )\n\n\nclass TestFactorPerformanceOutput(BaseModel):\n \
      \   \"\"\"Pydantic model for test_factor_performance node outputs.\"\"\"\n \
      \   factor_names: List[str] = (\n        Field(..., description=\"List of factor\
      \ names evaluated\")\n    )\n    avg_t_stats: List[float] = (\n        Field(...,\
      \ description=\"Average t\\u2011statistic from cross\\u2011sectional regressions\
      \ for each factor\")\n    )\n    annualized_sharpe: List[float] = (\n      \
      \  Field(..., description=\"Annualized Sharpe ratio derived from factor regression\
      \ predictive power\")\n    )\n    p_values: List[float] = (\n        Field(...,\
      \ description=\"P\\u2011value of the factor coefficient in the regression\"\
      )\n    )\n    is_significant: List[bool] = (\n        Field(..., description=\"\
      True if p\\u2011value < 0.05, indicating statistical significance\")\n    )\n\
      \n\ndef test_factor_performance(compute_factor_exposures_input: ComputeFactorExposuresOutput,\
      \ **kwargs) -> TestFactorPerformanceOutput:\n    \"\"\"\n    Evaluate historical\
      \ predictive performance of each individual factor by\n    running cross-sectional\
      \ regressions of next-day stock returns on factor\n    exposures. Returns summary\
      \ statistics including average t-statistics,\n    annualized Sharpe ratios,\
      \ p-values, and significance flags.\n\n    Parameters\n    ----------\n    factor_names\
      \ : List[str]\n        List of factor names computed for each security-day,\
      \ as generated by\n        compute_factor_exposures.\n    factor_exposures :\
      \ Dict[str, List[float]]\n        Mapping from factor names to their exposure\
      \ values for each\n        security-day across the dataset.\n    next_day_returns\
      \ : List[float]\n        List or array of next-day stock returns for each security-day\n\
      \        observation, aligned with factor exposures.\n\n    Returns\n    -------\n\
      \    Dict[str, List]\n        A dictionary containing performance metrics per\
      \ factor:\n        'factor_names' (List[str]), 'avg_t_stats' (List[float]),\n\
      \        'annualized_sharpe' (List[float]), 'p_values' (List[float]), and\n\
      \        'is_significant' (List[bool]) indicating statistical significance.\n\
      \n    Raises\n    ------\n    ValueError\n        If factor exposures or returns\
      \ are missing, misaligned, or empty.\n    RuntimeError\n        If regression\
      \ fitting fails for any factor due to data issues.\n\n    Examples\n    --------\n\
      \    >>> factor_names = ['momentum', 'value']\n    >>> factor_exposures = {\n\
      \    ...     'momentum': [0.1, 0.2, -0.1, 0.05],\n    ...     'value': [0.5,\
      \ 0.3, 0.1, -0.2]\n    >>> }\n    >>> next_day_returns = [0.02, 0.03, -0.01,\
      \ 0.0]\n    >>> results = test_factor_performance(factor_names, factor_exposures,\n\
      \    next_day_returns)\n    {'factor_names': ['momentum', 'value'],\n     'avg_t_stats':\
      \ [2.5, 1.1],\n     'annualized_sharpe': [1.3, 0.7],\n     'p_values': [0.015,\
      \ 0.28],\n     'is_significant': [True, False]}\n\n    >>> factor_names = ['quality']\n\
      \    >>> factor_exposures = {'quality': [0.2, 0.4, 0.3]}\n    >>> next_day_returns\
      \ = [0.01, 0.02, 0.015]\n    >>> results = test_factor_performance(factor_names,\
      \ factor_exposures,\n    next_day_returns)\n    {'factor_names': ['quality'],\n\
      \     'avg_t_stats': [3.2],\n     'annualized_sharpe': [1.6],\n     'p_values':\
      \ [0.005],\n     'is_significant': [True]}\n\n    \"\"\"\n    return TestFactorPerformanceOutput(\n\
      \        factor_names=[],\n        avg_t_stats=[],\n        annualized_sharpe=[],\n\
      \        p_values=[],\n        is_significant=[],\n    )"
    name: test_factor_performance
    nodes_depended_on:
    - compute_factor_exposures
    nodes_dependent_on: []
    output_structure:
    - description: List of factor names evaluated
      key: factor_names
      type: List[str]
    - description: Average t‑statistic from cross‑sectional regressions for each factor
      key: avg_t_stats
      type: List[float]
    - description: Annualized Sharpe ratio derived from factor regression predictive
        power
      key: annualized_sharpe
      type: List[float]
    - description: P‑value of the factor coefficient in the regression
      key: p_values
      type: List[float]
    - description: True if p‑value < 0.05, indicating statistical significance
      key: is_significant
      type: List[bool]
