      Numeric threshold for each compliance rule (e.g., 5% for position limit, 10%\
      \ for sector concentration, 0 for short selling, 1.5 for leverage cap, 0 for\
      \ reporting obligation).\")\n    )\n    verification_methods: List[str] = (\n\
      \        Field(..., description=\"Verification method used to validate compliance\
      \ with each rule (e.g., \\\"Portfolio value check\\\", \\\"Sector exposure calculation\\\
      \", \\\"Short sale flag\\\", \\\"Leverage ratio calculation\\\", \\\"Compliance\
      \ report upload check\\\").\")\n    )\n    is_compliance_met: List[bool] = (\n\
      \        Field(..., description=\"Boolean flags indicating whether each compliance\
      \ rule is currently satisfied.\")\n    )\n\n\nclass DraftOperationalWorkflowOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for draft_operational_workflow node outputs.\"\"\"\
      \n    step_numbers: List[int] = (\n        Field(..., description=\"Ordered\
      \ list of step numbers in the workflow\")\n    )\n    step_descriptions: List[str]\
      \ = (\n        Field(..., description=\"Textual description of each workflow\
      \ step\")\n    )\n    step_responsible: List[str] = (\n        Field(..., description=\"\
      Name of the system or team responsible for each step\")\n    )\n    workflow_summary:\
      \ str = (\n        Field(..., description=\"Concise summary of the overall operational\
      \ workflow\")\n    )\n\n\ndef draft_operational_workflow(outline_technology_stack_input:\
      \ OutlineTechnologyStackOutput, design_execution_strategy_input: DesignExecutionStrategyOutput,\
      \ develop_compliance_checks_input: DevelopComplianceChecksOutput, **kwargs)\
      \ -> DraftOperationalWorkflowOutput:\n    \"\"\"\n    Generate a detailed daily\
      \ operational workflow as a sequential numbered\n    list, specifying descriptions\
      \ and responsible parties for each step in the\n    strategy lifecycle.\n\n\
      \    Parameters\n    ----------\n    outline_technology_stack : dict\n     \
      \   Output from the technology stack node providing the systems and\n      \
      \  infrastructure components used in each pipeline stage.\n    design_execution_strategy\
      \ : dict\n        Details of the execution algorithm and parameters which influence\n\
      \        the execution and order generation steps.\n    develop_compliance_checks\
      \ : dict\n        The compliance rules checklist that must be satisfied before\
