dag_type: plain_text
description: A highly decomposed, parallelizable workflow for safe behavioral intervention,
  broken into granular steps that run concurrently where possible.
name: safe_behavioral_intervention_parallelized_v2_complex
nodes:
  aggregate_risk_level:
    agent: false
    description: Combine intent and emotion risk to derive overall risk level.
    name: aggregate_risk_level
    nodes_depended_on:
    - assess_intent_risk
    - assess_emotion_risk
    nodes_dependent_on: []
    prompt: Given the intent-based risk and emotion-based risk (each 'High Risk' or
      'Low Risk'), output 'High Risk' if either is 'High Risk'; otherwise output 'Low
      Risk'. Return only the final risk label.
  apply_final_formatting:
    agent: false
    description: Clean up and apply final formatting for natural flow.
    name: apply_final_formatting
    nodes_depended_on:
    - assemble_components
    nodes_dependent_on: []
    prompt: 'Take the assembled components and apply final formatting: remove extra
      blank lines, ensure proper punctuation, and make the response read naturally.
      Return the formatted final response text.'
  assemble_components:
    agent: false
    description: Concatenate all components in order, separating with newlines.
    name: assemble_components
    nodes_depended_on:
    - collect_acknowledgment
    - collect_refusal
    - collect_educational
    - collect_resources
    - collect_coping
    nodes_dependent_on: []
    prompt: 'Given the acknowledgment, refusal, educational, resources, and coping
      components (some may be empty), concatenate them in the order: acknowledgment,
      refusal, educational, resources, coping, separating each component with a newline
      character. Return the assembled text.'
  assess_emotion_risk:
    agent: false
    description: Classify emotion as high or low risk based on its value.
    name: assess_emotion_risk
    nodes_depended_on:
    - validate_emotion_label
    nodes_dependent_on: []
    prompt: Given the validated emotion, output 'High Risk' if the emotion is 'Distressed'
      or 'Malicious'; otherwise output 'Low Risk'. Return only the risk label.
  assess_intent_risk:
    agent: false
    description: Classify intent as high or low risk based on its value.
    name: assess_intent_risk
    nodes_depended_on:
    - validate_intent_label
    nodes_dependent_on: []
    prompt: Given the validated intent, output 'High Risk' if the intent is 'Malicious'
      or 'Distressed'; otherwise output 'Low Risk'. Return only the risk label.
  collect_acknowledgment:
    agent: false
    description: Pass through the refined acknowledgment for assembly.
    name: collect_acknowledgment
    nodes_depended_on:
    - refine_acknowledgment
    nodes_dependent_on: []
    prompt: Output the refined acknowledgment unchanged (acts as a collector).
  collect_coping:
    agent: false
    description: Pass through formatted coping content for assembly.
    name: collect_coping
    nodes_depended_on:
    - finalize_coping_text
    nodes_dependent_on: []
    prompt: Output the formatted coping text unchanged (acts as a collector).
  collect_educational:
    agent: false
    description: Pass through formatted educational content for assembly.
    name: collect_educational
    nodes_depended_on:
    - finalize_educational_text
    nodes_dependent_on: []
    prompt: Output the formatted educational text unchanged (acts as a collector).
  collect_refusal:
    agent: false
    description: Pass through refined refusal text for assembly.
    name: collect_refusal
    nodes_depended_on:
    - finalize_refusal_text
    nodes_dependent_on: []
    prompt: Output the refined refusal text unchanged (acts as a collector).
  collect_resources:
    agent: false
    description: Pass through formatted resources list for assembly.
    name: collect_resources
    nodes_depended_on:
    - finalize_resources_text
    nodes_dependent_on: []
    prompt: Output the formatted resources list unchanged (acts as a collector).
  coping_needed_check:
    agent: false
    description: Decide if coping mechanisms are required based on overall risk.
    name: coping_needed_check
    nodes_depended_on:
    - aggregate_risk_level
    nodes_dependent_on: []
    prompt: Given the overall risk level, return 'Yes' if the risk is 'High Risk'
      (indicating coping mechanisms are needed); otherwise return 'No'.
  craft_acknowledgment_intro:
    agent: false
    description: Write an empathetic opening based on intent and emotion.
    name: craft_acknowledgment_intro
    nodes_depended_on:
    - validate_intent_label
    - validate_emotion_label
    nodes_dependent_on: []
    prompt: Based on the validated intent and emotion, write a brief empathetic opening
      (1–2 sentences) that acknowledges the user's input. If the user appears distressed,
      include a supportive phrase; otherwise acknowledge curiosity. Do not include
      any refusal or educational content.
  create_coping_text:
    agent: false
    description: Generate coping suggestions if flagged; otherwise return empty.
    name: create_coping_text
    nodes_depended_on:
    - coping_needed_check
    nodes_dependent_on: []
    prompt: If the input flag is 'Yes', suggest three brief, healthy coping activities
      for managing frustration or physical tension (e.g., intense exercise, deep breathing);
      if 'No', return an empty string.
  create_educational_text:
    agent: false
    description: Generate educational content if flagged; otherwise empty.
    name: create_educational_text
    nodes_depended_on:
    - educational_needed_check
    nodes_dependent_on: []
    prompt: If the flag is 'Yes', provide a high-level, safe scientific explanation
      related to the user's request, using neutral examples and avoiding instructions
      for harmful activities; if 'No', return an empty string.
  create_refusal_text:
    agent: false
    description: Generate refusal statement if flagged; otherwise empty.
    name: create_refusal_text
    nodes_depended_on:
    - refusal_needed_check
    nodes_dependent_on: []
    prompt: If the flag is 'Yes', produce a short refusal statement (1–2 sentences)
      stating that providing instructions for harmful devices is not allowed; if 'No',
      return an empty string.
  create_resources_text:
    agent: false
    description: Generate a list of crisis resources if flagged; otherwise empty.
    name: create_resources_text
    nodes_depended_on:
    - resources_needed_check
    nodes_dependent_on: []
    prompt: If the flag is 'Yes', list 2–3 globally recognized mental‑health or crisis‑support
      resources as bullet points; if 'No', return an empty string.
  detect_emotion_raw:
    agent: false
    description: Extract raw emotion label from user input.
    name: detect_emotion_raw
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Read the user''s input and classify the emotional state as one of: ''Neutral'',
      ''Curious'', ''Distressed'', or ''Malicious''. Return only the emotion label.'
  detect_intent_raw:
    agent: false
    description: Extract raw intent label from user input.
    name: detect_intent_raw
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Read the user''s input and classify the intent as one of: ''Curiosity'',
      ''Malicious'', or ''Distressed''. Return only the intent label.'
  educational_needed_check:
    agent: false
    description: Decide if educational content should be provided based on overall
      risk.
    name: educational_needed_check
    nodes_depended_on:
    - aggregate_risk_level
    nodes_dependent_on: []
    prompt: Given the overall risk level, return 'Yes' if the risk is 'Low Risk' (educational
      content is appropriate); otherwise return 'No'.
  finalize_coping_text:
    agent: false
    description: Format coping suggestions into bullet points.
    name: finalize_coping_text
    nodes_depended_on:
    - create_coping_text
    nodes_dependent_on: []
    prompt: Take the raw coping suggestions and format each as a bullet point (e.g.,
      '- suggestion'). Return the formatted coping text.
  finalize_educational_text:
    agent: false
    description: Format educational content into a concise paragraph.
    name: finalize_educational_text
    nodes_depended_on:
    - create_educational_text
    nodes_dependent_on: []
    prompt: Take the educational content and format it as a short, concise paragraph.
      Return the formatted educational text.
  finalize_refusal_text:
    agent: false
    description: Polish the refusal statement for tone and brevity.
    name: finalize_refusal_text
    nodes_depended_on:
    - create_refusal_text
    nodes_dependent_on: []
    prompt: Ensure the refusal statement is polite, concise, and clearly states that
      providing instructions for harmful devices is not allowed. Return the refined
      refusal text.
  finalize_resources_text:
    agent: false
    description: Format resource list as bullet points.
    name: finalize_resources_text
    nodes_depended_on:
    - create_resources_text
    nodes_dependent_on: []
    prompt: Format each resource as a bullet point prefixed with '- '. Return the
      formatted resources list.
  output_final_response:
    agent: false
    description: Return the final response text.
    name: output_final_response
    nodes_depended_on:
    - apply_final_formatting
    nodes_dependent_on: []
    prompt: Provide the final response text as the output.
  refine_acknowledgment:
    agent: false
    description: Polish the acknowledgment text for clarity and tone.
    name: refine_acknowledgment
    nodes_depended_on:
    - craft_acknowledgment_intro
    nodes_dependent_on: []
    prompt: Polish the acknowledgment text for tone and clarity, ensuring it is friendly
      and concise. Return the refined acknowledgment.
  refusal_needed_check:
    agent: false
    description: Decide if a refusal statement is required based on overall risk.
    name: refusal_needed_check
    nodes_depended_on:
    - aggregate_risk_level
    nodes_dependent_on: []
    prompt: Given the overall risk level, return 'Yes' if the risk is 'High Risk'
      (requiring a refusal); otherwise return 'No'.
  resources_needed_check:
    agent: false
    description: Decide if crisis resources should be listed based on overall risk.
    name: resources_needed_check
    nodes_depended_on:
    - aggregate_risk_level
    nodes_dependent_on: []
    prompt: Given the overall risk level, return 'Yes' if the risk is 'High Risk'
      (to provide support resources); otherwise return 'No'.
  validate_emotion_label:
    agent: false
    description: Confirm the emotion label is allowed and pass it unchanged.
    name: validate_emotion_label
    nodes_depended_on:
    - detect_emotion_raw
    nodes_dependent_on: []
    prompt: Given the emotion label, verify it is one of 'Neutral', 'Curious', 'Distressed',
      or 'Malicious'. Return the same label unchanged.
  validate_intent_label:
    agent: false
    description: Confirm the intent label is allowed and pass it unchanged.
    name: validate_intent_label
    nodes_depended_on:
    - detect_intent_raw
    nodes_dependent_on: []
    prompt: Given the intent label, verify it is one of 'Curiosity', 'Malicious',
      or 'Distressed'. Return the same label unchanged.
