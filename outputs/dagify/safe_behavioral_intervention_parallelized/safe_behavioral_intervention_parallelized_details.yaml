dag_type: plain_text
description: A highly concurrent workflow that assesses user intent and emotion, determines
  risk level, and independently creates empathy, refusal, educational content, support
  resources, and coping suggestions before assembling a final safe response.
name: safe_behavioral_intervention_parallelized
nodes:
  assemble_final_response:
    agent: false
    description: Combine all generated components into a cohesive, safe final response.
    name: assemble_final_response
    nodes_depended_on:
    - create_empathic_acknowledgment
    - create_refusal_statement
    - create_educational_content
    - list_support_resources
    - list_coping_mechanisms
    nodes_dependent_on: []
    prompt: 'Combine the following components into a cohesive response in the order:
      (1) Empathic acknowledgment, (2) Refusal statement (if any), (3) Educational
      content (if any), (4) Support resources (if any), (5) Coping mechanisms (if
      any). Ensure the final response reads naturally and respects safety guidelines.'
  create_educational_content:
    agent: false
    description: Deliver a safe, high‑level scientific explanation when risk is low;
      otherwise return nothing.
    name: create_educational_content
    nodes_depended_on:
    - determine_risk_level
    nodes_dependent_on: []
    prompt: If the risk level is 'Low Risk', provide a high‑level, safe scientific
      explanation related to the user's request, using natural‑world or industrial‑safety
      examples and avoiding any instructions for weaponization. If the risk level
      is 'High Risk', return an empty string.
  create_empathic_acknowledgment:
    agent: false
    description: Generate a brief empathetic opening acknowledging the user's input
      and state.
    name: create_empathic_acknowledgment
    nodes_depended_on:
    - extract_intent
    - extract_emotion
    nodes_dependent_on: []
    prompt: Based on the intent and emotional state, write a brief empathetic opening
      (1–2 sentences) that acknowledges the user's input. If the user appears distressed,
      include a supportive phrase; otherwise acknowledge curiosity. Do not include
      any refusal or educational content.
  create_refusal_statement:
    agent: false
    description: Provide a short refusal if the request is high risk; otherwise produce
      no text.
    name: create_refusal_statement
    nodes_depended_on:
    - determine_risk_level
    nodes_dependent_on: []
    prompt: If the risk level is 'High Risk', produce a short refusal statement (1–2
      sentences) stating that providing instructions for harmful devices is not allowed.
      If the risk level is 'Low Risk', return an empty string.
  determine_risk_level:
    agent: false
    description: Label the request as High Risk if intent or emotion indicates malicious
      or distress, otherwise Low Risk.
    name: determine_risk_level
    nodes_depended_on:
    - extract_intent
    - extract_emotion
    nodes_dependent_on: []
    prompt: Given the intent ('Curiosity', 'Malicious', 'Distressed') and emotional
      state ('Neutral', 'Curious', 'Distressed', 'Malicious'), label the request as
      'High Risk' if intent is 'Malicious' or 'Distressed' or if emotional state is
      'Distressed' or 'Malicious'; otherwise label as 'Low Risk'. Return only the
      risk level.
  extract_emotion:
    agent: false
    description: Classify the user's emotional state as Neutral, Curious, Distressed,
      or Malicious.
    name: extract_emotion
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Read the user''s input and classify the emotional state as one of: ''Neutral'',
      ''Curious'', ''Distressed'', or ''Malicious''. Return only the emotional state
      label.'
  extract_intent:
    agent: false
    description: Classify the user's intent as Curiosity, Malicious, or Distressed.
    name: extract_intent
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Read the user''s input and classify the intent as one of: ''Curiosity'',
      ''Malicious'', or ''Distressed''. Return only the intent label.'
  list_coping_mechanisms:
    agent: false
    description: Suggest healthy coping activities when risk is high; otherwise omit.
    name: list_coping_mechanisms
    nodes_depended_on:
    - determine_risk_level
    nodes_dependent_on: []
    prompt: If the risk level is 'High Risk', suggest three brief, healthy activities
      for releasing physical tension or managing frustration (e.g., intense exercise,
      deep‑breathing). If the risk level is 'Low Risk', return an empty string.
  list_support_resources:
    agent: false
    description: List crisis‑support resources if the request is high risk; otherwise
      omit.
    name: list_support_resources
    nodes_depended_on:
    - determine_risk_level
    nodes_dependent_on: []
    prompt: If the risk level is 'High Risk', list 2–3 globally recognized mental‑health
      or crisis‑support resources (e.g., suicide‑prevention helplines) as a simple
      bullet list. If the risk level is 'Low Risk', return an empty string.
